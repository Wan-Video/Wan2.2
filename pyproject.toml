[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wan"
version = "2.2.0"
description = "Wan: Open and Advanced Large-Scale Video Generative Models"
authors = [
    { name = "Wan Team", email = "wan.ai@alibabacloud.com" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "opencv-python>=4.9.0.80",
    "diffusers>=0.31.0",
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "einops",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    "numpy>=1.23.5,<2"
]

[project.optional-dependencies]
# flash-attn has no official Windows wheel and needs a long source build.
# wan/modules/attention.py falls back to torch SDPA when it is missing.
flash-attn = ["flash_attn"]
animate = ["decord", "peft", "onnxruntime", "pandas", "matplotlib", "loguru", "sentencepiece"]
s2v = ["openai-whisper", "onnxruntime", "librosa", "decord", "omegaconf", "modelscope"]
dev = [
    "pytest",
    "flake8",
    "isort",
    "yapf",
    "mypy",
    "huggingface-hub[cli]"
]

[project.urls]
homepage = "https://wanxai.com"
documentation = "https://github.com/Wan-Video/Wan2.2"
repository = "https://github.com/Wan-Video/Wan2.2"
huggingface = "https://huggingface.co/Wan-AI/"
modelscope = "https://modelscope.cn/organization/Wan-AI"
discord = "https://discord.gg/p5XbdQV7"

[tool.setuptools.packages.find]
include = ["wan*"]

[tool.yapf]
based_on_style = "pep8"

[tool.isort]
profile = "black"

[tool.mypy]
# The codebase is almost entirely unannotated, so strict mode would emit
# thousands of errors and get ignored. Start permissive and tighten per-module
# as annotations land.
ignore_missing_imports = true


